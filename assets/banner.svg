<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#101c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usbBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b4a63"/>
      <stop offset="100%" stop-color="#1b2434"/>
    </linearGradient>
    <linearGradient id="usbMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2dc"/>
      <stop offset="100%" stop-color="#8a97a6"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d38a"/>
      <stop offset="100%" stop-color="#e0a744"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e2a42" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <circle cx="900" cy="180" r="220" fill="url(#glow)"/>

  <!-- encrypted binary particles -->
  <g fill="#2dd4bf" opacity="0.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
    <text x="770" y="70">10110</text>
    <text x="1020" y="95">01101</text>
    <text x="780" y="290">00110</text>
    <text x="1040" y="270">11010</text>
    <text x="700" y="180">01011</text>
  </g>

  <!-- USB drive illustration -->
  <g transform="translate(880,120)">
    <!-- connector -->
    <rect x="-40" y="30" width="60" height="60" rx="6" fill="url(#usbMetal)" stroke="#5c6b7d" stroke-width="2"/>
    <rect x="-30" y="42" width="18" height="36" fill="#2a3446"/>
    <rect x="-4" y="42" width="18" height="36" fill="#2a3446"/>
    <!-- body -->
    <rect x="20" y="0" width="150" height="120" rx="16" fill="url(#usbBody)" stroke="#0d1522" stroke-width="3"/>
    <rect x="34" y="14" width="122" height="92" rx="10" fill="#111c2c" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>
    <!-- padlock on drive face -->
    <g transform="translate(95,42)">
      <rect x="-22" y="8" width="44" height="34" rx="6" fill="url(#lockGrad)"/>
      <path d="M -14 8 L -14 -6 A 14 14 0 0 1 14 -6 L 14 8" fill="none" stroke="url(#lockGrad)" stroke-width="6"/>
      <circle cx="0" cy="24" r="5" fill="#7a4e10"/>
      <rect x="-2" y="24" width="4" height="12" fill="#7a4e10"/>
    </g>
    <circle cx="140" cy="16" r="4" fill="#2dd4bf"/>
  </g>

  <!-- data stream lines from usb -->
  <path d="M 1050 155 Q 1100 155 1130 130" fill="none" stroke="url(#accentLine)" stroke-width="2"/>
  <path d="M 1050 185 Q 1100 200 1140 210" fill="none" stroke="url(#accentLine)" stroke-width="2"/>
  <path d="M 850 60 Q 870 20 920 15" fill="none" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- decorative key-shaped accent left bottom -->
  <g transform="translate(90,270)" opacity="0.6">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e0a744" stroke-width="4"/>
    <rect x="12" y="-3" width="34" height="6" fill="#e0a744"/>
    <rect x="38" y="3" width="6" height="10" fill="#e0a744"/>
    <rect x="28" y="3" width="6" height="8" fill="#e0a744"/>
  </g>

  <!-- Headline -->
  <text x="60" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#f3f6fa" textLength="900" lengthAdjust="spacingAndGlyphs">
    Password Manager Portable
  </text>

  <!-- Tagline -->
  <text x="60" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a9c4d8" textLength="820" lengthAdjust="spacingAndGlyphs">
    <tspan x="60" dy="0">Stores your passwords in an encrypted file</tspan>
  </text>
  <text x="60" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a9c4d8" textLength="560" lengthAdjust="spacingAndGlyphs">
    <tspan x="60" dy="0">you can carry on a USB drive</tspan>
  </text>

  <!-- accent underline -->
  <rect x="60" y="272" width="180" height="4" rx="2" fill="#2dd4bf"/>
</svg>